[project]
name = "scverse-cp-hackathon-2026"
version = "0.1.0"
description = "CellProfiler plugins exporting to AnnData and SpatialData"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.11.4",
    "napari>=0.7.1",
    "pandas>=2.3.3",
    "pyqt6>=6.11.0",
    "scanpy>=1.11.5",
]

[dependency-groups]
# The plugin tests run against this environment, not CellProfiler's. The parts of the suite that
# import cellprofiler_core skip themselves when it is absent, which it is here.
dev = [
    "pytest>=8",
]
